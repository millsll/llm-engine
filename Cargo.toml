[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# --- 内部 crate ---
llm-types = { path = "crates/llm-types" }
llm-core = { path = "crates/llm-core" }
mem-cache = { path = "crates/mem-cache" }
llm-runtime = { path = "crates/llm-runtime" }
llm-tokenizer = { path = "crates/llm-tokenizer" }
kv-cache = { path = "crates/kv-cache" }

# --- 张量层 ---
candle-core = "0.11"
candle-nn = "0.11"

# --- 权重与分词 ---
safetensors = "0.8"
hf-hub = "1.0"
tokenizers = "0.22"

# --- 通用 ---
half = "2.7"
bytemuck = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"

# --- 服务端 ---
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
